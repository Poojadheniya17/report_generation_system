<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Report Portal{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, Segoe UI, Arial, sans-serif;
      background: #f4f5f7;
      color: #1f2328;
      margin: 0;
      padding: 40px 20px;
    }
    .container { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 20px; margin-bottom: 24px; }
    .card {
      background: #fff;
      border: 1px solid #d9dce1;
      border-radius: 6px;
      padding: 24px;
    }
    label { display: block; margin-bottom: 6px; font-size: 14px; }
    input[type=password] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #c6cad2;
      border-radius: 4px;
      font-size: 14px;
      margin-bottom: 16px;
    }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .error { color: #b42318; font-size: 14px; margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #e5e7eb; }
    th { color: #6b7280; font-weight: 600; font-size: 12px; text-transform: uppercase; }
    .status { padding: 2px 8px; border-radius: 4px; font-size: 12px; }
    .status-report_ready, .status-delivered { background: #dcfce7; color: #166534; }
    .status-received, .status-scored, .status-interpreted { background: #fef3c7; color: #92400e; }
    .status-failed { background: #fee2e2; color: #991b1b; }
    .muted { color: #9ca3af; }
    a.download { color: #2563eb; text-decoration: none; }
    a.download:hover { text-decoration: underline; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .topbar a { font-size: 13px; color: #6b7280; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
